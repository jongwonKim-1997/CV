about_content: | # this will include new lines to allow paragraphs
    Hi, I'm Jongwon Kim. I received my Ph.D. in Industrial and Management Engineering from POSTECH in August 2026 and am now a postdoctoral researcher at the POSTECH Future IT Innovation Lab. My research centers on time-series foundation models: adapting them to diverse downstream tasks such as forecasting and anomaly detection, and applying them to real-world problems in manufacturing. I also work on probabilistic modeling, including Gaussian processes and other Bayesian models, and its application to Bayesian optimization. Through collaborations with Samsung Electronics, SK hynix, POSCO, and KETI, I work at the intersection of machine learning and Quality, Statistics, and Reliability (QSR).
